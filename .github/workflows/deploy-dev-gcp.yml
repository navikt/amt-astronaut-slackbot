name: Deploy to dev-gcp

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build and deploy to dev-gcp
    runs-on: ubuntu-latest
    environment: dev-gcp
    concurrency:
      group: deploy-dev-gcp
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and push container image
        id: image
        uses: nais/docker-build-push@2d2b0a7193e65422b7f0355d4afb445e0a8b2cc3 # v0
        with:
          team: amt
          dockerfile: Dockerfile
          tag: ${{ github.sha }}

      - name: Deploy to dev-gcp
        uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/nais.yaml
          VAR: image=${{ steps.image.outputs.image }}
